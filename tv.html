<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamFusion TV</title>
    <link rel="stylesheet" href="https://sfusion.netlify.app/style/tv.css" />
  </head>
  <body>
    <div id="app">
      <nav id="nav">
        <div class="brand"><img class="logo" src="https://raw.githubusercontent.com/Javier0618/Imagenes/refs/heads/main/SFusionLogo.png" alt="" onerror="this.style.display='none'"><span>Stream<b>Fusion</b></span></div>
        <div id="tabs"></div>
        <div id="search-btn" class="tab focusable search-tab" data-kind="search" data-key="tab:search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>Buscar</div>
      </nav>

      <!-- Inicio y secciones: banner principal + filas -->
      <main id="screen-browse" class="screen" hidden>
        <div id="hero" class="hero" hidden>
          <div id="hero-bg-a" class="hero-bg"></div>
          <div id="hero-bg-b" class="hero-bg"></div>
          <div class="hero-shade"></div>
          <div class="hero-body">
            <div id="hero-kind" class="hero-kind"></div>
            <h1 id="hero-title"></h1>
            <div id="hero-meta" class="hero-meta"></div>
            <p id="hero-overview" class="hero-overview"></p>
            <div class="hero-actions">
              <button id="hero-play" class="btn primary hbtn focusable" data-kind="hero-play" data-key="hero:play">▶ Reproducir</button>
              <button id="hero-info" class="btn hbtn focusable" data-kind="hero-info" data-key="hero:info">Más información</button>
            </div>
          </div>
          <div id="hero-dots" class="hero-dots"></div>
        </div>
        <div id="rows" class="rows"></div>
      </main>

      <!-- "Ver todo": cuadrícula con carga progresiva -->
      <section id="screen-grid" class="screen" hidden>
        <div class="grid-head"><h1 id="grid-title"></h1><span id="grid-count"></span></div>
        <div id="grid" class="grid"></div>
      </section>

      <!-- Buscador: teclado en pantalla + resultados -->
      <section id="screen-search" class="screen" hidden>
        <div class="search-wrap">
          <div class="search-left">
            <div class="search-q"><span id="search-text"></span><i class="caret"></i></div>
            <div id="keys" class="keys"></div>
            <div id="keyx" class="keyx"></div>
          </div>
          <div class="search-right">
            <div id="search-hint" class="search-hint"></div>
            <div id="search-results" class="grid search-grid"></div>
          </div>
        </div>
      </section>

      <section id="screen-detail" class="screen" hidden></section>

      <section id="screen-player" class="screen" hidden>
        <iframe id="tv-player" tabindex="-1" src="about:blank" frameborder="0"
          allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </section>

      <section id="screen-login" class="screen" hidden>
        <div class="login-box">
          <h1>Iniciar sesión</h1>
          <p>Pulsa OK sobre un campo para escribir con el teclado del televisor.</p>
          <input id="login-email" class="focusable field" type="email" placeholder="Correo" autocomplete="off" />
          <input id="login-pass" class="focusable field" type="password" placeholder="Contraseña" autocomplete="off" />
          <button id="login-btn" class="focusable btn" data-kind="login">Entrar</button>
        </div>
      </section>

      <div id="confirm" hidden>
        <div class="cbox">
          <h2 id="confirm-title"></h2>
          <p id="confirm-text"></p>
          <div class="cbtns">
            <button id="confirm-yes" class="btn primary focusable" data-kind="c-yes" type="button">Quitar</button>
            <button id="confirm-no" class="btn focusable" data-kind="c-no" type="button">Cancelar</button>
          </div>
        </div>
      </div>

      <div id="toast" hidden></div>
      <div id="loading"><div class="spinner"></div></div>
    </div>

    <script type="module" src="https://sfusion.netlify.app/js/tv.js"></script>
  </body>
</html>
